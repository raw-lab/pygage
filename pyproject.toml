[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyGAGE"
dynamic = ["version"]
description = "Generally Applicable Gene-set Enrichment for pathway analysis in Python — a faithful, machine-precision port of the GAGE R package."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Richard A. White III", email = "rwhit101@charlotte.edu"},
    {name = "Jose L. Figueroa III", email = "jlfiguer@charlotte.edu"},
]
maintainers = [
    {name = "Richard A. White III", email = "rwhit101@charlotte.edu"},
]
keywords = [
    "bioinformatics", "gene set enrichment", "GAGE", "pathway analysis",
    "GSEA", "KEGG", "Gene Ontology", "Reactome", "MSigDB", "transcriptomics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=1.0",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
anndata = ["anndata"]
test = ["pytest>=7", "anndata"]
docs = ["sphinx>=7", "sphinx-rtd-theme", "myst-parser", "sphinx-copybutton"]
all = ["anndata", "pytest>=7", "sphinx>=7", "sphinx-rtd-theme", "myst-parser", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/raw-lab/pygage"
Repository = "https://github.com/raw-lab/pygage"
Documentation = "https://pygage.readthedocs.io"
Issues = "https://github.com/raw-lab/pygage/issues"

# Single unified console entry point (replaces the seven per-module scripts in 1.0.0).
[project.scripts]
pygage = "pygage.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pygage*"]

[tool.setuptools.package-data]
pygage = ["data/*.tsv", "data/regression/*.gz", "data/regression/*.json"]

[tool.setuptools.dynamic]
version = {attr = "pygage.__version__"}
