[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyGAGE"
dynamic = ["version"]
description = "Generally Applicable Gene-set Enrichment for pathway analysis in Python — a faithful, machine-precision port of the GAGE R package."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Richard A. White III", email = "rwhit101@charlotte.edu"},
    {name = "Jose L. Figueroa III", email = "jlfiguer@charlotte.edu"},
]
maintainers = [
    {name = "Richard A. White III", email = "rwhit101@charlotte.edu"},
]
keywords = [
    "bioinformatics", "gene set enrichment", "GAGE", "pathway analysis",
    "GSEA", "KEGG", "Gene Ontology", "Reactome", "MSigDB", "transcriptomics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=1.0",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
anndata = ["anndata"]
test = ["pytest>=7", "pytest-cov", "anndata"]
docs = ["sphinx>=7", "furo", "sphinx-design", "myst-parser", "sphinx-copybutton"]
dev = ["pytest>=7", "pytest-cov", "anndata", "ruff", "build", "sphinx>=7", "furo", "sphinx-design", "myst-parser", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/raw-lab/pygage"
Repository = "https://github.com/raw-lab/pygage"
Documentation = "https://pygage.readthedocs.io"
Issues = "https://github.com/raw-lab/pygage/issues"
Changelog = "https://github.com/raw-lab/pygage/blob/main/CHANGELOG.md"

[project.scripts]
pygage = "pygage.cli:main"

# ---- src/ layout: packages are discovered under src/ ----
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pygage*"]

[tool.setuptools.package-data]
pygage = ["py.typed", "data/*.tsv", "data/regression/*.gz", "data/regression/*.json"]

[tool.setuptools.dynamic]
version = {attr = "pygage.__version__"}

# ---- tooling ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Real-bug + import-hygiene rules. UP (pyupgrade) is intentionally omitted:
# it pushes PEP 585/604 syntax that is inappropriate for a py3.8 target.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E741", "E702"]  # line length (formatter), math-style names, one-line semicolons

[tool.coverage.run]
source = ["pygage"]
branch = true
